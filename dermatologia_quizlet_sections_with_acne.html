<!DOCTYPE html>
<html lang="el">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Dermatology Quest — Flashcards</title>
<style>
:root {
  --bg:#f6f7fb; --panel:#fff; --ink:#202437; --muted:#70758c;
  --accent:#6956e8; --accent2:#9f8cff; --good:#2f9e68; --bad:#d84c63;
  --line:#e5e7f0; --shadow:0 18px 50px rgba(42,38,92,.12);
}
*{box-sizing:border-box}
body{margin:0;font-family:Inter,ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif;background:linear-gradient(135deg,#f8f7ff,#f3f6ff 45%,#fff9f5);color:var(--ink)}
button,input{font:inherit}
.app{display:grid;grid-template-columns:300px 1fr;min-height:100vh}
.sidebar{padding:24px 18px;border-right:1px solid var(--line);background:rgba(255,255,255,.78);backdrop-filter:blur(18px);position:sticky;top:0;height:100vh;overflow:auto}
.brand{font-size:24px;font-weight:900;letter-spacing:-.6px;margin:4px 8px 6px}
.subtitle{color:var(--muted);font-size:13px;line-height:1.45;margin:0 8px 18px}
.search{width:100%;border:1px solid var(--line);border-radius:14px;padding:11px 13px;background:#fff;margin-bottom:14px}
.section-btn{width:100%;border:0;background:transparent;text-align:left;padding:11px 12px;border-radius:12px;color:#4e5266;cursor:pointer;margin:3px 0}
.section-btn:hover,.section-btn.active{background:#ece9ff;color:#4938c7;font-weight:750}
.main{padding:28px;max-width:1050px;width:100%;margin:auto}
.topbar{display:flex;gap:12px;align-items:center;justify-content:space-between;margin-bottom:20px}
.titlewrap h1{margin:0;font-size:28px;letter-spacing:-.7px}
.meta{color:var(--muted);font-size:14px;margin-top:5px}
.controls{display:flex;flex-wrap:wrap;gap:8px}
.btn{border:1px solid var(--line);background:#fff;border-radius:12px;padding:10px 13px;cursor:pointer;font-weight:700}
.btn.primary{background:var(--accent);color:#fff;border-color:var(--accent)}
.progress-shell{height:10px;background:#e8e9f2;border-radius:999px;overflow:hidden;margin:16px 0 22px}
.progress{height:100%;background:linear-gradient(90deg,var(--accent),var(--accent2));width:0%;transition:.3s}
.card-stage{perspective:1400px}
.card{min-height:420px;position:relative;transform-style:preserve-3d;transition:transform .55s;cursor:pointer}
.card.flipped{transform:rotateY(180deg)}
.face{position:absolute;inset:0;backface-visibility:hidden;border:1px solid var(--line);border-radius:28px;background:var(--panel);box-shadow:var(--shadow);padding:42px;display:flex;flex-direction:column;justify-content:center;align-items:center;text-align:center}
.back{transform:rotateY(180deg);background:linear-gradient(145deg,#fff,#f6f3ff)}
.label{text-transform:uppercase;letter-spacing:1.6px;color:var(--accent);font-size:12px;font-weight:900;margin-bottom:24px}
.front-text{font-size:30px;line-height:1.25;font-weight:850;max-width:760px}
.back-text{font-size:23px;line-height:1.5;max-width:800px}
.hint{position:absolute;bottom:21px;color:var(--muted);font-size:13px}
.navrow{display:grid;grid-template-columns:1fr auto 1fr;align-items:center;margin-top:18px;gap:12px}
.counter{font-weight:800;color:#595d73;min-width:110px;text-align:center}
.navrow .right{justify-self:end}
.rating{display:flex;gap:12px;justify-content:center;margin-top:18px}
.rate{border:0;padding:12px 20px;border-radius:14px;color:#fff;font-weight:850;cursor:pointer}
.bad{background:var(--bad)} .good{background:var(--good)}
.overview{margin-top:30px;background:rgba(255,255,255,.78);border:1px solid var(--line);border-radius:22px;padding:20px}
.overview h2{margin:0 0 12px;font-size:18px}
.pills{display:flex;gap:8px;flex-wrap:wrap}
.pill{font-size:12px;padding:7px 10px;border-radius:999px;background:#f0f1f6;color:#575b70}
.pill.good{background:#e4f6ed;color:#26734e} .pill.bad{background:#fde9ed;color:#a52f43}
.mobile-menu{display:none}
@media(max-width:820px){
 .app{display:block} .sidebar{position:relative;height:auto;border-right:0;border-bottom:1px solid var(--line);padding:16px}
 .section-list{display:flex;overflow:auto;gap:6px;padding-bottom:4px} .section-btn{min-width:220px}
 .main{padding:18px} .face{padding:26px} .card{min-height:390px} .front-text{font-size:25px} .back-text{font-size:19px}
 .topbar{align-items:flex-start;flex-direction:column}
}
@media print{.sidebar,.controls,.navrow,.rating,.hint{display:none!important} .app{display:block} .main{max-width:none} .card{transform:none!important;min-height:auto} .face{position:relative;box-shadow:none;margin-bottom:14px;display:block;text-align:left} .back{transform:none}}
</style>
</head>
<body>
<div class="app">
<aside class="sidebar">
  <div class="brand">Dermatology Quest</div>
  <p class="subtitle">Quizlet-style flashcards με ενότητες, shuffle, επανάληψη και αποθήκευση προόδου στον browser.</p>
  <input id="search" class="search" placeholder="Αναζήτηση κάρτας…">
  <div id="sections" class="section-list"></div>
</aside>
<main class="main">
  <div class="topbar">
    <div class="titlewrap">
      <h1 id="sectionTitle"></h1>
      <div id="meta" class="meta"></div>
    </div>
    <div class="controls">
      <button class="btn" id="shuffle">🔀 Shuffle</button>
      <button class="btn" id="reset">↺ Reset</button>
      <button class="btn primary" onclick="window.print()">🖨 Print</button>
    </div>
  </div>
  <div class="progress-shell"><div id="progress" class="progress"></div></div>
  <div class="card-stage">
    <div id="card" class="card" tabindex="0">
      <section class="face front"><div class="label">ΕΡΩΤΗΣΗ</div><div id="frontText" class="front-text"></div><div class="hint">Κλικ ή Space για αναστροφή</div></section>
      <section class="face back"><div class="label">ΑΠΑΝΤΗΣΗ</div><div id="backText" class="back-text"></div><div class="hint">Κλικ για επιστροφή</div></section>
    </div>
  </div>
  <div class="rating">
    <button class="rate bad" id="again">Δεν το ξέρω</button>
    <button class="rate good" id="know">Το ξέρω</button>
  </div>
  <div class="navrow">
    <button class="btn" id="prev">← Προηγούμενη</button>
    <div id="counter" class="counter"></div>
    <button class="btn right" id="next">Επόμενη →</button>
  </div>
  <div class="overview">
    <h2>Πρόοδος ενότητας</h2>
    <div id="stats" class="pills"></div>
  </div>
</main>
</div>
<script>
const sections = [{"title": "1. Μορφολογία βλαβών", "cards": [["Τι είναι η κηλίδα;", "Επίπεδη, περιγεγραμμένη μεταβολή χρώματος χωρίς αλλαγή σύστασης ή πάχους. Στη συγκεκριμένη σύνοψη: <1 cm· αν είναι μεγαλύτερη περιγράφεται ως πλάκα."], ["Τι είναι η βλατίδα;", "Στερεή, επηρμένη βλάβη μικρότερη από 1 cm."], ["Τι είναι το οζίδιο;", "Περιγεγραμμένη ψηλαφητή μάζα που αναπτύσσεται από το βάθος προς την επιφάνεια. Αν είναι >1 cm αναφέρεται ως όγκος."], ["Τι είναι ο πομφός;", "Παροδικό λευκό ή ρόδινο οίδημα του δέρματος, με ή χωρίς περιφερικό ερύθημα. Εμφανίζεται και εξαφανίζεται μέσα σε ώρες, όπως στην κνίδωση."], ["Φυσαλίδα vs πομφόλυγα", "Και οι δύο περιέχουν ορώδες ή αιματηρό υγρό. Φυσαλίδα: <1 cm. Πομφόλυγα: >1 cm."], ["Τι είναι η φλύκταινα;", "Φυσαλίδα που περιέχει πύον αντί για ορό ή αίμα."], ["Τι είναι τα λέπια;", "Πετάλια της επιδερμίδας από συσσώρευση φυσιολογικής ή παθολογικής κερατίνης."], ["Τι είναι οι εφελκίδες;", "Αποξηραμένος ορός, πύον ή άλλο εξίδρωμα στην επιφάνεια του δέρματος. Κλασικό παράδειγμα: μολυσματικό κηρίο."], ["Διάβρωση vs έλκωση", "Διάβρωση: επιφανειακή απώλεια επιδερμίδας, δεν περνά τη βασική στιβάδα και δεν αφήνει ουλή. Έλκωση: φτάνει στο χόριο και αφήνει ουλή."], ["Τι είναι λειχηνοποίηση;", "Πάχυνση της επιδερμίδας με επιπεδωμένη/τονισμένη επιφάνεια, συνήθως από χρόνιο ξύσιμο."], ["Τι είναι εμβροχή;", "Μαλακή και υγρή επιδερμίδα λόγω παρατεταμένης έκθεσης σε υγρασία."], ["Χαρακτηριστικές διατάξεις βλαβών", "Γραμμοειδής: π.χ. έρπητας ζωστήρας. Κυκλική/δακτυλιοειδής: διαγνωστική σε ορισμένα νοσήματα. Σε ομάδες: π.χ. απλός έρπητας."]]}, {"title": "2. Βακτηριακές λοιμώξεις", "cards": [["Μολυσματικό κηρίο: κύριο αίτιο και εικόνα", "Συχνό στα παιδιά. Συνήθως S. aureus, ειδικά στην πομφολυγώδη μορφή· μπορεί και Streptococcus στη μη πομφολυγώδη. Χαρακτηριστικές μελιτόχροες εφελκίδες."], ["Τι είναι η νεογνική πέμφιγα;", "Απειλητική για τη ζωή πομφολυγώδης μορφή μολυσματικού κηρίου στο νεογνό."], ["Θυλακίτιδα, δοθίηνας, ψευδάνθρακας", "Θυλακίτιδα: επιφανειακή λοίμωξη θυλάκου. Δοθίηνας: βαθύτερη και επώδυνη θυλακική λοίμωξη. Ψευδάνθρακας: πολύ βαθιά λοίμωξη με διηθημένη ερυθρή μάζα και πιθανή κεντρική ρήξη."], ["Τοπική θεραπεία απλής εντοπισμένης σταφυλοκοκκικής λοίμωξης", "Μουπιροκίνη, φουσιδικό οξύ ή αντισηπτικά, ανάλογα με την περίπτωση."], ["Ερυσίπελας: αίτιο και επίπεδο προσβολής", "Συνήθως β-αιμολυτικός στρεπτόκοκκος, κυρίως S. pyogenes. Στο κλασικό ερυσίπελας προσβάλλεται το χόριο."], ["Ερυσίπελας vs κυτταρίτιδα", "Ερυσίπελας: πιο επιφανειακό, σαφέστερα όρια. Κυτταρίτιδα: συμμετοχή και υποδορίου λίπους, ασαφή όρια."], ["Κλινική εικόνα ερυσιπέλατος", "Οξεία εμπύρετη κατάσταση, επώδυνη, θερμή, οιδηματώδης, τεταμένη και έντονα ερυθρή πλάκα."], ["Πότε προκύπτει νεκρωτική περιτονιΐτιδα;", "Όταν η στρεπτοκοκκική λοίμωξη επεκταθεί βαθιά στις περιτονίες και στους υποκείμενους μύες."], ["Οστρακιά: χαρακτηριστική γλώσσα και εξάνθημα", "Λευκό επίχρισμα που αποπίπτει και αφήνει «γλώσσα φράουλα». Στικτό ερυθρό εξάνθημα που ξεκινά από τον τράχηλο και ακολουθεί απολέπιση."], ["Ερύθρασμα: μικρόβιο και Wood", "Corynebacterium minutissimum. Καστανές λεπιδώδεις βλάβες σε πτυχές· στη λάμπα Wood δίνουν κοραλλιοειδή ερυθρό φθορισμό."]]}, {"title": "3. Φυματίωση δέρματος και λέπρα", "cards": [["Συχνότερη μορφή δερματικής φυματίωσης", "Κοινός φυματιώδης λύκος, lupus vulgaris."], ["Μυρμηκιώδης φυματίωση", "Άμεσος ενοφθαλμισμός σε άτομο που έχει ήδη εκτεθεί σε TB. Βλατίδα που εξελίσσεται σε πλάκα σε εκτεθειμένη περιοχή, π.χ. άκρα χείρα."], ["Χοιράδωση / scrofuloderma", "Δερματική επέκταση από φυματίωση λεμφαδένων, οστών ή αρθρώσεων, με διήθηση, λέπτυνση, έλκη, συρίγγια και ουλοποίηση."], ["Τι είναι οι φυματίδες;", "Ιδιόμορφες δερματικές εκδηλώσεις που δεν περιέχουν μυκοβακτηρίδια."], ["Σκληρό ερύθημα Bazin", "Εν τω βάθει όζοι, κυρίως στις κνήμες, με εξάρσεις και υφέσεις· μπορεί να ελκωθούν."], ["Βασική θεραπεία δερματικής φυματίωσης", "Ριφαμπικίνη, ισονιαζίδη, εθαμβουτόλη και πυραζιναμίδη, σύμφωνα με το αντιφυματικό σχήμα."], ["TT λέπρα: ανοσία και εικόνα", "Καλή κυτταρική ανοσία, paucibacillary. Λίγες καλά εντοπισμένες, ελαφρά λεπιδώδεις βλάβες με απώλεια αισθητικότητας και πάχυνση περιφερικών νεύρων."], ["LL λέπρα: ανοσία και εικόνα", "Κακή ανοσιακή απάντηση, multibacillary. Πολλαπλές ασαφείς βλάβες, όχι λεπιδώδεις· η αισθητική απώλεια καθυστερεί. Μπορεί να εμφανιστεί λεόντεια όψη."], ["Αντίδραση τύπου I στη λέπρα", "Σε ενδιάμεσες μορφές: νέες βλάβες και έντονη φλεγμονή παλαιών βλαβών, με κίνδυνο επιδείνωσης νευρικής βλάβης."], ["Αντίδραση τύπου II στη λέπρα", "Κυρίως LL/BL· λεπροειδές οζώδες ερύθημα με ερυθρούς όζους, πυρετό και καταβολή. Μπορεί να επηρεάζει νεύρα και οφθαλμούς."]]}, {"title": "4. Ιογενείς λοιμώξεις", "cards": [["Κοινές μυρμηκιές: εικόνα και Koebner", "Σκληρές υπερκερατωσικές βλατίδες, συχνά σε χέρια, πήχεις, γόνατα και πόδια. Σε τραυματισμένες γραμμές εμφανίζονται γραμμοειδώς: φαινόμενο Koebner."], ["Ομαλές μυρμηκιές", "Επίπεδες βλατίδες φυσιολογικού χρώματος, κυρίως σε πρόσωπο και άκρα."], ["Πελματιαία μυρμηκιά: πότε βιοψία;", "Όταν υπάρχει διαγνωστική αμφιβολία ή ύποπτη βαθιά/διηθητική βλάβη."], ["Οξυτενή κονδυλώματα: εικόνα", "Ρόδινες, υγρές βλατίδες ή πλάκες, συχνά νηματοειδείς ή ανθοκραμβοειδείς. Κυρίως σεξουαλικώς μεταδιδόμενα."], ["Ιμικουιμόδη: βασικός μηχανισμός", "Ανοσοτροποποιητικός παράγοντας που ενισχύει την παραγωγή ιντερφερόνης και χρησιμοποιείται τοπικά στα κονδυλώματα."], ["Μολυσματική τέρμινθος: παθογνωμονική εικόνα", "Μικρές μαργαριτοειδείς θολωτές βλατίδες με κεντρική ομφαλωτή εντύπωση και λευκοκίτρινο κρεμώδες υλικό."], ["Μολυσματική τέρμινθος: φυσική πορεία", "Μπορεί να διαρκέσει μήνες ή χρόνια, αλλά συνήθως αυτοϊάται."], ["Πρωτολοίμωξη HSV στο στόμα", "Οξεία ερπητική ουλοστοματίτιδα: πυρετός, επώδυνα ούλα, φυσαλίδες και έλκη σε γλώσσα/χείλη, λεμφαδενοπάθεια."], ["Υποτροπιάζων HSV: πρόδρομο και πορεία", "Καύσος πριν τις βλάβες· ερύθημα → φυσαλίδες → φλύκταινες/εφελκίδες. Υποχώρηση περίπου σε 7-10 ημέρες."], ["Έκζεμα herpeticum / Kaposi", "Διάσπαρτη HSV λοίμωξη σε ατοπική δερματίτιδα. Μπορεί να είναι απειλητική και απαιτεί άμεση συστηματική ακυκλοβίρη."], ["Ανεμοβλογιά: χαρακτηριστικό εξάνθημα", "Βλάβες σε διαφορετικά στάδια ταυτόχρονα: βλατίδες, φυσαλίδες, φλύκταινες και εφελκίδες."], ["Επιπλοκές ανεμοβλογιάς", "Εγκεφαλίτιδα, πνευμονία, θρομβοπενία και εμβρυικό σύνδρομο ανεμοβλογιάς."], ["Έρπης ζωστήρας: βασική εικόνα", "Επανενεργοποίηση VZV. Μονόπλευρο επώδυνο φυσαλιδώδες εξάνθημα σε κατανομή δερμοτομίου."], ["Συχνή όψιμη επιπλοκή ζωστήρα", "Μεθερπητική νευραλγία."]]}, {"title": "5. Μυκητιάσεις και παράσιτα", "cards": [["Τρία γένη δερματοφύτων", "Microsporum, Trichophyton, Epidermophyton."], ["Tinea capitis: εξωτριχικός παρασιτισμός", "Ο μύκητας αναπτύσσεται στην επιφάνεια της τρίχας· η τρίχα σπάει ψηλότερα και ορισμένα είδη φθορίζουν στη Wood."], ["Tinea capitis: ενδοτριχικός παρασιτισμός", "Ο μύκητας βρίσκεται μέσα στην τρίχα· η τρίχα σπάει στο επίπεδο του δέρματος και δημιουργούνται «μαύρα στίγματα»."], ["Κηρίο του Κέλσου", "Έντονα φλεγμονώδης, βαλτώδης μάζα του τριχωτού με πύον και συρίγγια. Κίνδυνος ουλωτικής αλωπεκίας."], ["Tinea corporis", "Δακτυλιοειδής ερυθηματώδης βλάβη που επεκτείνεται φυγόκεντρα, με κεντρική ίαση και επηρμένη περιφέρεια."], ["Tinea cruris", "Σαφώς αφοριζόμενο, κνησμώδες, λεπιδώδες εξάνθημα που επεκτείνεται έξω από τη βουβωνική πτυχή."], ["Τρεις μορφές tinea pedis", "Μεσοδακτύλια, υπερκερατωσική τύπου «μοκασινιού» και φυσαλιδώδης."], ["Tinea incognito", "Δερματοφυτία της οποίας η εικόνα αλλοιώθηκε από τοπικά κορτικοστεροειδή: προσωρινή βελτίωση και μετά επέκταση/υποτροπή."], ["Πότε χρειάζεται συστηματική θεραπεία δερματοφυτίας;", "Όταν προσβάλλονται τρίχες ή νύχια, όταν η νόσος είναι εκτεταμένη, πολυεστιακή, ανθεκτική στην τοπική αγωγή ή tinea incognito."], ["Ποικιλόχρους πιτυρίαση: μικρόβιο και μικροσκόπηση", "Malassezia furfur. Στην άμεση μικροσκόπηση: εικόνα «μακαρόνια με κιμά»."], ["Candida σε πάνα: χαρακτηριστικό", "Ερυθρή περιοχή με περιφερική απολέπιση και δορυφόρα φλυκταινί οχειλικές αύλακες, οπισθοωτιαία περιοχή και κορμός."], ["Παιδική σμηγματορροϊκή δερματίτιδα: κνησμός", "Χαρακτηριστικά απουσιάζει ο κνησμός."]]}, {"title": "8. Ψωρίαση και άλλες φλεγμονώδεις", "cards": [["Κλασική ψωριασική πλάκα", "Καλά περιγεγραμμένη ερυθρή πλάκα με παχιά αργυρόχροα λέπια."], ["Σημείο Auspitz", "Στικτή αιμορραγία μετά την αφαίρεση των λεπιών/έντονο ξύσιμο."], ["Koebner στην ψωρίαση", "Εμφάνιση νέων ψωριασικών βλαβών σε σημεία τραυματισμού."], ["Σταγονοειδής ψωρίαση", "Πολλές μικρές πλάκες στον κορμό και στα άκρα, συχνά μετά από στρεπτοκοκκική φαρυγγίτιδα."], ["Ανάστροφη/καμπτική ψωρίαση", "Ψωρίαση σε πτυχές, όπως μασχάλες, υπομαζικά και περινεϊκά."], ["Ψωρίαση ονύχων", "Βοθρία, ονυχόλυση, υπονύχια υπερκεράτωση και «κηλίδα ελαίου»."], ["Von Zumbusch", "Οξεία γενικευμένη φλυκταινώδης ψωρίαση με πυρετό και κακουχία."], ["Ψωριασική αρθρίτιδα", "Οροαρνητική αρθρίτιδα με ποικίλα πρότυπα· συχνά συνυπάρχουν αλλοιώσεις ονύχων."], ["Ομαλός λειχήνας: 6 P", "Pruritic, Purple, Polygonal, Planar, Papules, Plaques."], ["Wickham striae", "Λευκωπές δικτυωτές γραμμές στην επιφάνεια των βλαβών του ομαλού λειχήνα."], ["Ροδόχρους πιτυρίαση: αρχική βλάβη", "Μητρική πλάκα (herald patch), που προηγείται του γενικευμένου εξανθήματος."], ["Ροδόχρους πιτυρίαση: κατανομή", "Στον κορμό κατά τις γραμμές του δέρματος, συχνά σαν «χριστουγεννιάτικο δέντρο»."]]}, {"title": "9. Πομφολυγώδη νοσήματα", "cards": [["Πομφολυγώδες πεμφιγοειδές: ηλικία και φυσαλίδες", "Κυρίως ηλικιωμένοι. Τεταμένες πομφόλυγες λόγω υποεπιδερμικού διαχωρισμού."], ["Πομφολυγώδες πεμφιγοειδές: βλεννογόνοι", "Συνήθως δεν προσβάλλονται ή προσβάλλονται πολύ λιγότερο από την πέμφιγα."], ["Πέμφιγα vulgaris: φυσαλίδες", "Χαλαρές, εύθραυστες πομφόλυγες λόγω ενδοεπιδερμικής ακανθόλυσης."], ["Πέμφιγα vulgaris: βλεννογόνοι", "Συχνή και σημαντική προσβολή στόματος και άλλων βλεννογόνων."], ["Σημείο Nikolsky", "Η επιδερμίδα αποκολλάται με πλάγια πίεση σε φαινομενικά υγιές ή περιβλαβικό δέρμα."], ["Διάγνωση πέμφιγας", "Βιοψία από άκρο νέας βλάβης, ιστολογία και άμεσος ανοσοφθορισμός."]]}, {"title": "10. Συστηματικές εκδηλώσεις, τρίχες, νύχια, μελάγχρωση", "cards": [["Συστηματικά αίτια γενικευμένου κνησμού χωρίς πρωτοπαθή βλάβη", "Χολόσταση, νεφρική ανεπάρκεια, έλλειψη σιδήρου, πολυκυτταραιμία, θυρεοειδοπάθειες, λεμφώματα, ηλικία και ψυχολογικοί παράγοντες."], ["Οζώδες ερύθημα: εικόνα", "Επώδυνοι εν τω βάθει ερυθροί όζοι, κυρίως στις κνήμες, που εξελίσσονται χρωματικά σαν μώλωπες."], ["Συχνά αίτια οζώδους ερυθήματος", "Σαρκοείδωση, φυματίωση, στρεπτοκοκκική λοίμωξη, ΙΦΝΕ, Yersinia, φάρμακα· συχνά και ιδιοπαθές."], ["Μορφέα", "Εντοπισμένο σκληρόδερμα χωρίς συστηματική συμμετοχή."], ["Ανδρογενετική αλωπεκία άνδρα vs γυναίκας", "Άνδρας: συχνά κροταφική/μετωπιαία υποχώρηση. Γυναίκα: διάχυτη μετωποβρεγματική αραίωση."], ["Γυροειδής αλωπεκία: δέρμα και τρίχες", "Καλά περιγεγραμμένες άτριχες πλάκες με κατά τα άλλα φυσιολογικό δέρμα και «τρίχες θαυμαστικού» στην περιφέρεια."], ["Ολική vs καθολική γυροειδής αλωπεκία", "Ολική: όλο το τριχωτό κεφαλής. Καθολική: όλο το σώμα."], ["Ονυχογρύπωση", "Παχιά, σκληρή, φαιοκίτρινη και παραμορφωμένη ονυχαία πλάκα, συχνά στον μεγάλο δάκτυλο ηλικιωμένων."], ["Χλόασμα", "Συμμετρικές μελαγχρωματικές κηλίδες/πλάκες στο πρόσωπο, σχετιζόμενες με κύηση, αντισυλληπτικά και ήλιο."], ["Λεύκη", "Επίκτητη, συχνά αυτοάνοση, πλήρης απώλεια μελάγχρωσης σε σαφείς πλάκες χωρίς άλλη αλλοίωση."], ["Αλφισμός: βασικός κίνδυνος", "Μεγάλη ευαισθησία στην UV ακτινοβολία και πολύ αυξημένος κίνδυνος δερματικών καρκίνων."]]}, {"title": "11. Σεξουαλικώς μεταδιδόμενα νοσήματα", "cards": [["Πρωτογόνος σύφιλη: συφιλιδικό έλκος", "Ανώδυνο, σκληρό, καθαρό, συνήθως μονήρες έλκος στο σημείο ενοφθαλμισμού, με ανώδυνη σύστοιχη λεμφαδενίτιδα."], ["Χρόνος εμφάνισης πρωτογόνου σύφιλης", "Περίπου 10-90 ημέρες μετά τη μόλυνση."], ["Δευτερογόνος σύφιλη: δέρμα", "Γενικευμένα κηλιδώδη ή βλατιδώδη εξανθήματα, πλατέα κονδυλώματα, αλωπεκία και βλεννογονικές αλλοιώσεις."], ["Λανθάνουσα σύφιλη", "Δεν υπάρχουν κλινικές βλάβες· η διάγνωση γίνεται ορολογικά. Πρώιμη <1 έτος, όψιμη >1 έτος."], ["Τριτογόνος σύφιλη", "Κομμιώματα, καρδιαγγειακή σύφιλη και νευροσύφιλη."], ["Τριάδα Hutchinson στη συγγενή σύφιλη", "Δόντια Hutchinson, κώφωση και διάμεση κερατίτιδα."], ["VDRL/RPR", "Μη ειδικές δοκιμασίες διαλογής και παρακολούθησης της ανταπόκρισης στη θεραπεία."], ["FTA-ABS / TPHA", "Ειδικές τρεπονημικές δοκιμασίες που συνήθως παραμένουν θετικές."], ["Θεραπεία σύφιλης στην εγκυμοσύνη", "Πενικιλίνη, ακόμη και αν απαιτηθεί απευαισθητοποίηση."], ["Γονόρροια στον άνδρα", "Οξεία ουρηθρίτιδα με πυώδη έκκριση, καύσο και δυσουρία."], ["Γονόρροια στη γυναίκα", "Συχνά ασυμπτωματική. Μπορεί να προκαλέσει τραχηλίτιδα, ουρηθρίτιδα και φλεγμονώδη νόσο της πυέλου."], ["Fitz-Hugh-Curtis", "Περιηπατίτιδα ως επιπλοκή γονοκοκκικής ή χλαμυδιακής πυελικής φλεγμονής."], ["Γενικευμένη γονοκοκκική λοίμωξη", "Πυρετός, μεταναστευτική πολυαρθραλγία/αρθρίτιδα και λίγες δερματικές βλάβες, συχνά σε άκρα, παλάμες και πέλματα."]]}, {"title": "12. Ακμή", "cards": [["Τι είναι η κοινή ακμή;", "Χρόνια φλεγμονώδης νόσος της τριχοσμηγματογόνου μονάδας. Παρουσιάζει φαγέσωρες, βλατίδες, φλύκταινες και σε βαριές μορφές οζίδια ή κύστεις."], ["Πότε εμφανίζεται συνήθως η κοινή ακμή;", "Συνήθως στην εφηβεία. Μπορεί να αρχίσει 1–2 χρόνια πριν από την εμμηναρχή, συχνά υποχωρεί σε 3–4 χρόνια, αλλά μπορεί να επιμείνει μετά τα 30."], ["Ποιες είναι οι συχνότερες εντοπίσεις της ακμής;", "Πρόσωπο, ανώτερος θώρακας, ώμοι, άνω ράχη και βραχίονες — περιοχές πλούσιες σε σμηγματογόνους αδένες."], ["Ποιες είναι οι μη φλεγμονώδεις βλάβες της ακμής;", "Οι ανοικτοί και οι κλειστοί φαγέσωρες."], ["Ανοικτός vs κλειστός φαγέσωρας", "Ανοικτός: μαύρο στίγμα με ανοικτό θυλακικό στόμιο. Κλειστός: λευκό στίγμα με κλειστό θυλακικό στόμιο."], ["Ποιες είναι οι φλεγμονώδεις βλάβες της ακμής;", "Βλατίδες, φλύκταινες, οζίδια, κύστεις και σε βαριές μορφές αποστήματα ή συρίγγια."], ["Ποια είναι τα 4 βασικά στοιχεία της παθογένειας της ακμής;", "Αυξημένο σμήγμα, υπερκερατινοποίηση και απόφραξη του πόρου, πολλαπλασιασμός Cutibacterium acnes και φλεγμονή."], ["Ποιος είναι ο ρόλος των ανδρογόνων;", "Διεγείρουν τους σμηγματογόνους αδένες και αυξάνουν την παραγωγή σμήγματος."], ["Τι είναι η νεογνική ακμή;", "Ήπια ακμή της βρεφικής ηλικίας, συνήθως στο πρόσωπο, που κατά κανόνα είναι αυτοπεριοριζόμενη."], ["Τι είναι η φαρμακευτική ακμή;", "Μονόμορφο ακμοειδές εξάνθημα από φάρμακα, όπως κορτικοστεροειδή ή ανδρογόνα. Συχνά λείπουν οι φαγέσωρες."], ["Τι είναι η τροπική ακμή;", "Ακμοειδές εξάνθημα που επιδεινώνεται από θερμό και υγρό κλίμα, συνήθως στον κορμό."], ["Τι είναι η κεραυνοβόλος ακμή;", "Βαριά οξεία φλεγμονώδης ακμή με επώδυνες ελκωτικές βλάβες, πυρετό και συστηματικά συμπτώματα."], ["Τι είναι η διηθητική/συρρέουσα ακμή;", "Βαριά μορφή με βαθιά οζίδια, κύστεις, αποστήματα και συρίγγια, με υψηλό κίνδυνο ουλών."], ["Ποια είναι η βασική τοπική θεραπεία της φαγεσωρικής ακμής;", "Τα τοπικά ρετινοειδή, επειδή ομαλοποιούν την κερατινοποίηση και προλαμβάνουν νέους φαγέσωρες."], ["Τι κάνει το υπεροξείδιο του βενζοϋλίου;", "Μειώνει το C. acnes και τη φλεγμονή χωρίς να προκαλεί βακτηριακή αντοχή. Συχνά συνδυάζεται με τοπικό αντιβιοτικό."], ["Ποια τοπικά αντιβιοτικά χρησιμοποιούνται;", "Κλινδαμυκίνη ή ερυθρομυκίνη, κατά προτίμηση μαζί με υπεροξείδιο βενζοϋλίου και όχι ως μακροχρόνια μονοθεραπεία."], ["Πότε χρησιμοποιούνται συστηματικά αντιβιοτικά;", "Σε μέτρια ή σοβαρή φλεγμονώδη ακμή, για περιορισμένο διάστημα και μαζί με κατάλληλη τοπική αγωγή."], ["Ποια συστηματικά αντιβιοτικά χρησιμοποιούνται συχνά;", "Τετρακυκλίνες όπως δοξυκυκλίνη ή μινοκυκλίνη. Η ερυθρομυκίνη μπορεί να χρησιμοποιηθεί όταν οι τετρακυκλίνες δεν ενδείκνυνται."], ["Πότε ενδείκνυται η ισοτρετινοΐνη;", "Σε σοβαρή οζοκυστική ή ουλοποιό ακμή, σε αποτυχία άλλων θεραπειών ή όταν υπάρχει υψηλός κίνδυνος μόνιμων ουλών."], ["Ποιος είναι ο σημαντικότερος κίνδυνος της ισοτρετινοΐνης;", "Είναι ισχυρά τερατογόνος και απαιτεί αυστηρή πρόληψη κύησης σύμφωνα με το θεραπευτικό πρωτόκολλο."], ["Ποιες συχνές ανεπιθύμητες ενέργειες έχει η ισοτρετινοΐνη;", "Χειλίτιδα, ξηροδερμία, ξηροφθαλμία και πιθανή αύξηση λιπιδίων ή ηπατικών ενζύμων."], ["Πότε υποπτευόμαστε ορμονικό υπόβαθρο;", "Σε επίμονη ακμή ενήλικης γυναίκας με ακανόνιστο κύκλο, υπερτρίχωση, ανδρογενετική αλωπεκία ή άλλα σημεία υπερανδρογονισμού/PCOS."], ["Ποια ορμονική θεραπεία μπορεί να χρησιμοποιηθεί σε γυναίκες;", "Συνδυασμένα αντισυλληπτικά και, σε επιλεγμένες περιπτώσεις, αντιανδρογόνα όπως σπιρονολακτόνη, με ιατρική παρακολούθηση."], ["Πώς μειώνεται ο κίνδυνος ουλών ακμής;", "Με έγκαιρη και αποτελεσματική θεραπεία, ειδικά στις βαθιές φλεγμονώδεις, οζώδεις ή κυστικές βλάβες."], ["Τι είναι η ροδόχρους νόσος;", "Χρόνια φλεγμονώδης δερματοπάθεια του προσώπου με ερύθημα, flushing, τηλεαγγειεκτασίες, βλατίδες και φλύκταινες."], ["Πώς ξεχωρίζει η ροδόχρους από την κοινή ακμή;", "Στη ροδόχρου συνήθως δεν υπάρχουν φαγέσωρες και κυριαρχούν το ερύθημα και οι τηλεαγγειεκτασίες."], ["Ποιοι είναι συχνοί εκλυτικοί παράγοντες ροδόχρου;", "Ήλιος, θερμότητα, ζεστά ροφήματα, αλκοόλ, πικάντικα τρόφιμα, άσκηση και συναισθηματικό στρες."], ["Ποια θεραπεία χρησιμοποιείται στη ροδόχρου;", "Τοπική μετρονιδαζόλη, αζελαϊκό οξύ ή ιβερμεκτίνη. Σε πιο έντονη νόσο μπορεί να χρησιμοποιηθεί δοξυκυκλίνη από το στόμα."], ["Τι είναι το ρινόφυμα;", "Υπερτροφική μορφή ροδόχρου με πάχυνση και παραμόρφωση της μύτης, κυρίως σε άνδρες."], ["Τι είναι η ροδόχρους εκ στεροειδών;", "Ροδόχρους-όμοιο εξάνθημα που προκαλείται ή επιδεινώνεται από παρατεταμένη χρήση ισχυρών τοπικών κορτικοστεροειδών στο πρόσωπο."]]}];
let sectionIndex = 0, cardIndex = 0, order = [], filtered = null;
const state = JSON.parse(localStorage.getItem("dermQuestState") || "{}");

const $ = id => document.getElementById(id);
function key(s,c){return `${s}-${c}`}
function save(){localStorage.setItem("dermQuestState",JSON.stringify(state))}
function currentCards(){return filtered ?? sections[sectionIndex].cards}
function initOrder(){order=[...Array(currentCards().length).keys()]; cardIndex=0}
function renderSections(){
 $("sections").innerHTML="";
 sections.forEach((s,i)=>{
   const b=document.createElement("button");
   b.className="section-btn"+(i===sectionIndex?" active":"");
   b.textContent=`${s.title} · ${s.cards.length}`;
   b.onclick=()=>{sectionIndex=i;filtered=null;$("search").value="";initOrder();render()};
   $("sections").appendChild(b);
 });
}
function render(){
 renderSections();
 const cards=currentCards();
 if(!cards.length){
   $("sectionTitle").textContent="Δεν βρέθηκαν κάρτες";
   $("frontText").textContent="Δοκίμασε διαφορετική αναζήτηση.";
   $("backText").textContent="";
   $("counter").textContent="0 / 0"; return;
 }
 if(cardIndex>=order.length)cardIndex=0;
 const idx=order[cardIndex], card=cards[idx];
 $("sectionTitle").textContent=filtered ? "Αποτελέσματα αναζήτησης" : sections[sectionIndex].title;
 $("meta").textContent=`${cards.length} flashcards · Χρησιμοποίησε ← → και Space`;
 $("frontText").innerHTML=card[0];
 $("backText").innerHTML=card[1];
 $("card").classList.remove("flipped");
 $("counter").textContent=`${cardIndex+1} / ${order.length}`;
 $("progress").style.width=`${((cardIndex+1)/order.length)*100}%`;
 renderStats();
}
function renderStats(){
 const cards=currentCards(); let good=0,bad=0,newc=0;
 cards.forEach((_,i)=>{const v=state[key(sectionIndex,i)]; if(v==="good")good++; else if(v==="bad")bad++; else newc++;});
 $("stats").innerHTML=`<span class="pill good">Ξέρω: ${good}</span><span class="pill bad">Επανάληψη: ${bad}</span><span class="pill">Νέες: ${newc}</span>`;
}
function next(){cardIndex=(cardIndex+1)%order.length;render()}
function prev(){cardIndex=(cardIndex-1+order.length)%order.length;render()}
$("card").onclick=()=>$("card").classList.toggle("flipped");
$("next").onclick=next; $("prev").onclick=prev;
$("know").onclick=()=>{state[key(sectionIndex,order[cardIndex])]="good";save();next()};
$("again").onclick=()=>{state[key(sectionIndex,order[cardIndex])]="bad";save();next()};
$("shuffle").onclick=()=>{for(let i=order.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[order[i],order[j]]=[order[j],order[i]]} cardIndex=0;render()};
$("reset").onclick=()=>{if(confirm("Να διαγραφεί η πρόοδος αυτής της ενότητας;")){sections[sectionIndex].cards.forEach((_,i)=>delete state[key(sectionIndex,i)]);save();render()}};
$("search").addEventListener("input",e=>{
 const q=e.target.value.trim().toLowerCase();
 if(!q){filtered=null;initOrder();render();return}
 filtered=[];
 sections.forEach(s=>s.cards.forEach(c=>{if((c[0]+" "+c[1]).toLowerCase().includes(q))filtered.push(c)}));
 order=[...Array(filtered.length).keys()];cardIndex=0;render();
});
document.addEventListener("keydown",e=>{
 if(e.target.tagName==="INPUT")return;
 if(e.code==="Space"){e.preventDefault();$("card").classList.toggle("flipped")}
 if(e.key==="ArrowRight")next();
 if(e.key==="ArrowLeft")prev();
 if(e.key==="1")$("again").click();
 if(e.key==="2")$("know").click();
});
initOrder();render();
</script>
